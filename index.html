
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Timer pro</title>
    <style>
        :root {
            --ios-blue: #0A84FF;
            --bg: radial-gradient(circle at 50% 50%, #1c1c1e 0%, #000000 100%);
            --glass: rgba(30, 30, 30, 0.98);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body, html { 
            margin: 0; padding: 0; background: #000; color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100%; width: 100%; overflow: hidden;
        }

        .app-view {
            height: 100vh; width: 100vw; display: flex;
            flex-direction: column; justify-content: center;
            align-items: center; cursor: pointer; position: relative;
            background: var(--bg);
        }

        .top-label {
            position: absolute; top: 12%; font-size: 13px;
            color: var(--ios-blue); letter-spacing: 5px; text-transform: uppercase;
            font-weight: 400; text-align: center; width: 100%;
            transition: opacity 0.3s;
        }

        /* Timer Size Optimized */
        .timer-container {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; width: 100%;
        }

        .timer-unit { display: flex; flex-direction: column; align-items: center; margin: 5px 0; }
        
        .digit { 
            font-size: 9vh; /* Perfect size for mobile */
            font-weight: 200; 
            line-height: 1; 
            letter-spacing: -2px; 
            font-variant-numeric: tabular-nums;
        }
        
        .tag { font-size: 9px; color: #555; text-transform: uppercase; letter-spacing: 2px; }

        /* Modal / Pop-up Styling */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(20px);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; opacity: 0; pointer-events: none; transition: 0.3s ease;
        }
        .overlay.show { opacity: 1; pointer-events: auto; }

        .modal {
            width: 85%; max-width: 350px;
            background: var(--glass); border-radius: 30px;
            padding: 25px; transform: scale(0.9); transition: 0.4s cubic-bezier(0.2, 1, 0.3, 1);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .overlay.show .modal { transform: scale(1); }

        .group { margin-bottom: 20px; }
        .label-sm { font-size: 10px; color: #777; margin-bottom: 8px; display: block; font-weight: 700; }
        
        input {
            width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: #fff; padding: 12px; border-radius: 12px; font-size: 14px;
        }

        .btn {
            width: 100%; padding: 15px; border-radius: 15px; border: none;
            font-weight: 600; cursor: pointer; margin-top: 10px;
        }
        .btn-blue { background: var(--ios-blue); color: #fff; }
        .btn-dark { background: #2c2c2e; color: #888; font-size: 12px; }

        #history-list { max-height: 150px; overflow-y: auto; margin: 10px 0; }
        .h-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #222; font-size: 12px; }

        @media (orientation: landscape) {
            .timer-container { flex-direction: row; gap: 40px; }
            .digit { font-size: 18vw; }
        }
    </style>
</head>
<body>

    <div class="app-view" id="main-view">
        <div class="top-label" id="display-label">FOCUS MODE</div>
        
        <div class="timer-container">
            <div class="timer-unit"><div class="digit" id="h">00</div><div class="tag">Hours</div></div>
            <div class="timer-unit"><div class="digit" id="m">00</div><div class="tag">Minutes</div></div>
            <div class="timer-unit"><div class="digit" id="s">00</div><div class="tag">Seconds</div></div>
        </div>
        
        <div style="position:absolute; bottom:20px; font-size:8px; opacity:0.1;">Hold 2s for Settings</div>
    </div>

    <div class="overlay" id="overlay">
        <div class="modal">
            <div class="group">
                <span class="label-sm">TOP TEXT</span>
                <input type="text" id="input-label" value="FOCUS MODE">
                <div id="toggle-label" style="margin-top:10px; font-size:12px; color:var(--ios-blue); cursor:pointer;">● Visible</div>
            </div>
            
            <div class="group">
                <span class="label-sm">TIMER (MINUTES)</span>
                <input type="number" id="input-min" value="0">
            </div>

            <div class="group">
                <span class="label-sm">HISTORY</span>
                <div id="history-list"></div>
                <button class="btn btn-dark" id="download-btn">Download Report (.txt)</button>
            </div>

            <button class="btn btn-blue" id="save-btn">Save & Close</button>
        </div>
    </div>

    <script>
        let time = 0;
        let isRunning = false;
        let targetMin = 0;
        let timerInterval;
        let holdTimer;
        let history = JSON.parse(localStorage.getItem('SUD_JS_DATA')) || [];
        const audio = new Audio("https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3");

        // Elements
        const mainView = document.getElementById('main-view');
        const overlay = document.getElementById('overlay');
        const displayLabel = document.getElementById('display-label');
        const inputLabel = document.getElementById('input-label');
        const inputMin = document.getElementById('input-min');
        const toggleLabelBtn = document.getElementById('toggle-label');
        const historyList = document.getElementById('history-list');

        function updateDisplay() {
            const h = Math.floor(time / 3600).toString().padStart(2, '0');
            const m = Math.floor((time % 3600) / 60).toString().padStart(2, '0');
            const s = (time % 60).toString().padStart(2, '0');
            document.getElementById('h').innerText = h;
            document.getElementById('m').innerText = m;
            document.getElementById('s').innerText = s;
        }

        function startTimer() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
            isRunning = true;
            if (targetMin > 0 && time === 0) time = targetMin * 60;
            
            timerInterval = setInterval(() => {
                if (targetMin > 0) {
                    if (time <= 1) {
                        time = 0;
                        stopTimer();
                        audio.play();
                        setTimeout(() => { audio.pause(); audio.currentTime = 0; }, 7000);
                    } else {
                        time--;
                    }
                } else {
                    time++;
                }
                updateDisplay();
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            saveToHistory();
            time = 0;
            updateDisplay();
        }

        function saveToHistory() {
            let actualSecs = (targetMin > 0) ? (targetMin * 60 - time) : time;
            if (actualSecs > 10) {
                const entry = {
                    date: new Date().toLocaleDateString('hi-IN'),
                    mins: Math.floor(actualSecs / 60)
                };
                history.unshift(entry);
                history = history.slice(0, 10);
                localStorage.setItem('SUD_JS_DATA', JSON.stringify(history));
                renderHistory();
            }
        }

        function renderHistory() {
            historyList.innerHTML = history.map(h => 
                `<div class="h-item"><span>${h.date}</span><b>${h.mins}m study</b></div>`
            ).join('');
        }

        // Long Press Logic
        mainView.addEventListener('mousedown', () => { holdTimer = setTimeout(() => overlay.classList.add('show'), 2000); });
        mainView.addEventListener('touchstart', () => { holdTimer = setTimeout(() => overlay.classList.add('show'), 2000); });
        mainView.addEventListener('mouseup', () => clearTimeout(holdTimer));
        mainView.addEventListener('touchend', () => clearTimeout(holdTimer));

        // Click to Start/Stop
        mainView.addEventListener('click', () => {
            if (overlay.classList.contains('show')) return;
            isRunning ? stopTimer() : startTimer();
        });

        // Settings Actions
        document.getElementById('save-btn').addEventListener('click', () => {
            displayLabel.innerText = inputLabel.value;
            targetMin = parseInt(inputMin.value) || 0;
            overlay.classList.remove('show');
        });

        toggleLabelBtn.addEventListener('click', () => {
            if (displayLabel.style.opacity === "0") {
                displayLabel.style.opacity = "1";
                toggleLabelBtn.innerText = "● Visible";
            } else {
                displayLabel.style.opacity = "0";
                toggleLabelBtn.innerText = "○ Hidden";
            }
        });

        document.getElementById('download-btn').addEventListener('click', () => {
            const text = "STUDY REPORT\n" + history.map(h => `${h.date}: ${h.mins}m`).join("\n");
            const blob = new Blob([text], {type: 'text/plain'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = "Sudhanshu_Report.txt";
            a.click();
        });

        renderHistory();
        updateDisplay();
    </script>
</body>
</html>
