<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>  Timer</title>
    <style>
        :root {
            --ios-blue: #0A84FF;
            --ios-red: #FF453A;
            --bg: radial-gradient(circle at center, #1c1c1e 0%, #000000 100%);
            --glass: rgba(25, 25, 25, 0.95);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html { 
            margin: 0; padding: 0; background: #000; color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh; width: 100vw; overflow: hidden;
        }

        .app-view {
            height: 100%; width: 100%; display: flex;
            flex-direction: row; justify-content: center; align-items: center; 
            gap: 5vw; cursor: pointer; position: relative;
            background: var(--bg); transition: 0.5s;
        }

        .app-view.running {
            background: radial-gradient(circle at center, #001d3d 0%, #000000 100%);
        }

        .top-label {
            position: absolute; top: 8%; font-size: 14px;
            color: var(--ios-blue); letter-spacing: 4px; text-transform: uppercase;
            text-align: center; width: 100%; font-weight: 600;
            display: flex; justify-content: center; align-items: center; gap: 8px;
        }

        .status-dot {
            width: 8px; height: 8px; background: var(--ios-red);
            border-radius: 50%; display: inline-block;
            box-shadow: 0 0 10px var(--ios-red);
        }
        .running .status-dot { background: #32D74B; box-shadow: 0 0 10px #32D74B; }

        .digit { font-size: 24vw; font-weight: 200; line-height: 1; letter-spacing: -8px; }
        
        .timer-unit { display: flex; flex-direction: column; align-items: center; }
        .tag { font-size: 12px; color: #666; text-transform: uppercase; margin-top: 10px; }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(25px);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; opacity: 0; pointer-events: none; transition: 0.4s;
        }
        .overlay.show { opacity: 1; pointer-events: auto; }

        .modal {
            width: 85%; max-width: 450px; background: var(--glass);
            border-radius: 30px; padding: 25px; transform: scale(0.9); transition: 0.4s;
            border: 1px solid rgba(255,255,255,0.1);
            max-height: 90vh; overflow-y: auto;
        }

        .input-box {
            width: 100%; background: #1a1a1a; border: 1px solid #333;
            color: #fff; padding: 12px; border-radius: 12px; margin: 10px 0; font-size: 16px;
        }

        .checkbox-container {
            display: flex; align-items: center; gap: 10px; margin: 10px 0;
            font-size: 13px; color: #aaa; cursor: pointer;
        }

        .btn {
            width: 100%; padding: 16px; border-radius: 16px; border: none;
            font-weight: 600; cursor: pointer; margin-top: 10px;
        }
        .btn-blue { background: var(--ios-blue); color: #fff; }
        .btn-save-as { background: #32D74B; color: #000; margin-top: 20px; font-size: 15px; }
        .btn-reset { background: #ff453a22; color: #ff453a; margin-top: 15px; }

        #history-list { margin-top: 20px; border-top: 1px solid #333; padding-top: 10px; }
        .h-item { display: flex; justify-content: space-between; padding: 5px 0; color: #888; font-size: 12px; }

        @media (orientation: portrait) {
            .app-view { flex-direction: column; gap: 10px; }
            .digit { font-size: 28vw; }
        }
    </style>
</head>
<body>

    <div class="app-view" id="main-view">
        <div class="top-label">
            <span class="status-dot"></span>
            <span id="display-label">STUDY MODE do</span>
        </div>
        <div class="timer-unit"><div class="digit" id="h">00</div><div class="tag">HR</div></div>
        <div class="timer-unit"><div class="digit" id="m">00</div><div class="tag">MIN</div></div>
        <div class="timer-unit"><div class="digit" id="s">00</div><div class="tag">SEC</div></div>
    </div>

    <div class="overlay" id="overlay">
        <div class="modal">
            <h3 style="text-align:center; margin-top:0;">Settings</h3>
            
            <label style="font-size:11px; color:#888;">TOP TEXT</label>
            <input type="text" id="input-label" class="input-box" placeholder="e.g. Study Time">
            
            <label class="checkbox-container">
                <input type="checkbox" id="hide-text-cb"> Hide Label (Only Dot)
            </label>
            
            <label style="font-size:11px; color:#888;">TARGET MINS (0 = Stopwatch)</label>
            <input type="number" id="input-min" class="input-box" value="0">

            <button class="btn btn-blue" id="save-btn">Save  Settings</button>
            
            <div id="history-list"></div>
            
            <button class="btn btn-save-as" id="save-as-btn">💾 Save File As...</button>
            
            <button class="btn btn-reset" id="stop-btn">Reset & Save Session</button>
        </div>
    </div>

    <script>
        let time = 0, isRunning = false, targetMin = 0, timerInterval, holdTimer, wakeLock = null;
        let history = JSON.parse(localStorage.getItem('SUD_DATA')) || [];
        const alarm = new Audio("https://cdn.pixabay.com/audio/2022/03/15/audio_731427181.mp3");

        const mainView = document.getElementById('main-view');
        const overlay = document.getElementById('overlay');
        const displayLabel = document.getElementById('display-label');

        async function requestWakeLock() {
            try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
        }

        function updateDisplay() {
            document.getElementById('h').innerText = Math.floor(time / 3600).toString().padStart(2, '0');
            document.getElementById('m').innerText = Math.floor((time % 3600) / 60).toString().padStart(2, '0');
            document.getElementById('s').innerText = (time % 60).toString().padStart(2, '0');
        }

        function startTimer() {
            alarm.play().then(() => { alarm.pause(); alarm.currentTime = 0; }).catch(() => {});
            if (!isRunning) {
                isRunning = true;
                mainView.classList.add('running');
                requestWakeLock();
                if (targetMin > 0 && time === 0) time = targetMin * 60;
                timerInterval = setInterval(() => {
                    if (targetMin > 0) {
                        if (time <= 1) { time = 0; finishSession(); } else time--;
                    } else time++;
                    updateDisplay();
                }, 1000);
            }
        }

        function pauseTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            mainView.classList.remove('running');
            if (wakeLock) wakeLock.release().then(() => wakeLock = null);
        }

        function finishSession() {
            pauseTimer();
            alarm.play();
            saveToLocal();
            setTimeout(() => { alert("⏰ Time's up!"); alarm.pause(); }, 300);
        }

        function saveToLocal() {
            let actualTime = (targetMin > 0) ? (targetMin * 60 - time) : time;
            if (actualTime > 5) {
                history.unshift({d: new Date().toLocaleString(), m: Math.floor(actualTime/60)});
                localStorage.setItem('SUD_DATA', JSON.stringify(history.slice(0, 50)));
                renderHistory();
            }
        }

        function renderHistory() {
            document.getElementById('history-list').innerHTML = history.slice(0,3).map(h => 
                `<div class="h-item"><span>📅 ${h.d.split(',')[0]}</span><b>${h.m}m</b></div>`).join('');
        }

        // --- THE "SAVE AS" FILE MANAGER FUNCTION ---
        async function saveAsFile() {
            const content = history.map(h => `${h.d}: ${h.m} minutes`).join('\n') || "No data.";
            
            if ('showSaveFilePicker' in window) {
                try {
                    // Ye asli File Manager popup khulega
                    const handle = await window.showSaveFilePicker({
                        suggestedName: 'Sudhanshu_Report.txt',
                        types: [{
                            description: 'Text File',
                            accept: {'text/plain': ['.txt']},
                        }],
                    });
                    const writable = await handle.createWritable();
                    await writable.write(content);
                    await writable.close();
                    alert("File successfully saved!");
                } catch (err) {
                    console.log("Save cancelled");
                }
            } else {
                // Agar browser support nahi karta (mobile) toh ye fallback
                const a = document.createElement('a');
                a.href = URL.createObjectURL(new Blob([content]));
                a.download = "Sudhanshu_Report.txt";
                a.click();
                alert("Saving via download (Manager not supported on this browser)");
            }
        }

        mainView.addEventListener('touchstart', () => holdTimer = setTimeout(() => overlay.classList.add('show'), 1500));
        mainView.addEventListener('touchend', () => clearTimeout(holdTimer));
        mainView.addEventListener('mousedown', () => holdTimer = setTimeout(() => overlay.classList.add('show'), 1500));
        mainView.addEventListener('mouseup', () => clearTimeout(holdTimer));
        
        mainView.addEventListener('click', () => { 
            if (!overlay.classList.contains('show')) isRunning ? pauseTimer() : startTimer(); 
        });

        document.getElementById('save-btn').addEventListener('click', () => {
            displayLabel.innerText = document.getElementById('input-label').value || "REVISION MODE";
            displayLabel.style.display = document.getElementById('hide-text-cb').checked ? 'none' : 'inline';
            const nt = parseInt(document.getElementById('input-min').value) || 0;
            if (nt !== targetMin) { targetMin = nt; time = 0; }
            overlay.classList.remove('show');
            updateDisplay();
        });

        document.getElementById('stop-btn').addEventListener('click', () => {
            saveToLocal(); time = 0; updateDisplay(); overlay.classList.remove('show');
        });

        document.getElementById('save-as-btn').addEventListener('click', saveAsFile);

        renderHistory();
        updateDisplay();
    </script>
</body>
</html>
